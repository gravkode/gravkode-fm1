# GRAV CODE's build settings (tools/build.py)
name = "GRAV_CODE"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_73"          # package identity (each firmware its own; the template's is 11): dev FM-1_7300, releases FM-1_73XXYYZZ
usb_manufacturer = "GRAV CODE"
usb_product = "GRAV CODE FM-1"
include = ["vendor"]
cpu2 = true
# A failure of the second core (some FM-1s' CPU1 misreads shared RAM now and then) gives it up: that block is
# silent (dsp/grav_engine.c: the dropped job is never replayed), the render goes on on one core until power-off.
# Without it, the FM-1 would restart mid-play, and two failed starts would be safe mode.
cpu2_fallback = true
cpu2_stack = 8192              # nested Plaits engine calls; DEBUG shows the measured high water mark

o2 = [
    "dsp/grav_engine.c",
    "dsp/grav_libc.c",
    "synth/synth.c",
    "synth/envelope.c",
    "synth/lfo.c",
    "synth/event_queue.c",
    "seq/seq.c",
    "seq/bank.c",                               # the patterns in the flash (main loop)
    "dsp/grav_plaits.cpp",
    "dsp/grav_beads.cpp",
    "vendor/stmlib/dsp/units.cc",
    "vendor/stmlib/utils/random.cc",
    "vendor/plaits/resources.cc",
    "vendor/plaits/dsp/engine/*.cc",            # all of Plaits' engines (not its voice.cc: GRAV CODE's own voice)
    "vendor/plaits/dsp/engine2/*.cc",
    "vendor/plaits/dsp/chords/*.cc",
    "vendor/plaits/dsp/fm/*.cc",
    "vendor/plaits/dsp/physical_modelling/*.cc",
    "vendor/plaits/dsp/speech/*.cc",
    "vendor/beads/resources.cc",
    "vendor/beads/dsp/*.cc",                    # Beads' processor (its synth mode is left out of vendor/)
]

# TEST: stmlib's portable code instead of its ARM assembly; M_PI: newlib leaves it out in strict C++;
# _LIBCPP_DISABLE_EXTERN_TEMPLATE: no libc++ library is linked (none on the FM-1, and the host links C), so the
# templates the engines use (std::sort) are made in their units, not taken from it; stmlib's STATIC_ASSERT is a
# typedef nothing uses, by design; -fdata-sections: each table its own section, so the link drops those nothing reads
# (Beads' resources.cc carries its synth mode's 100 KB of wavetables)
o2_cflags = ["-DM_PI=3.14159265358979323846", "-DTEST", "-D_LIBCPP_DISABLE_EXTERN_TEMPLATE",
             "-Wno-unused-local-typedef", "-fdata-sections"]
# the C library's and libc++'s headers from the AC79 SDK, which the toolchain's C++ compiler lacks (the FM-1 only)
o2_device_include = ["vendor/cxx", "vendor/newlib"]
words = "words.tsv"
# no radio: Bluetooth (ble) and WiFi (wifi) are left out, so nothing of JieLi's radio libraries is linked
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "Hybrid DSP synthesizer for M-VAVE FM-1"
repo = "https://github.com/gravkode/gravkode-fm1"
licence = "MPL-2.0"
credits = "Built on fm1-base. Sound engines: Mutable Instruments Plaits; effect: Mutable Instruments Beads; both by Émilie Gillet (MIT)."

vendored = ["vendor/"]
