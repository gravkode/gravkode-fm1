# GRAV CODE's build settings (tools/build.py)
name = "GRAV_CODE"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_73"          # package identity (each firmware its own; the template's is 11): dev FM-1_7300, releases FM-1_73XXYYZZ
usb_manufacturer = "GRAV CODE"
usb_product = "GRAV CODE FM-1"
include = ["vendor"]

o2 = [
    "dsp/grav_engine.c",
    "dsp/grav_libm.c",
    "synth/synth.c",
    "synth/envelope.c",
    "synth/lfo.c",
    "synth/event_queue.c",
    "dsp/grav_plaits.cpp",
    "vendor/stmlib/dsp/units.cc",
    "vendor/plaits/resources.cc",
    "vendor/plaits/dsp/engine/waveshaping_engine.cc",
    "vendor/plaits/dsp/engine/fm_engine.cc",
    "vendor/plaits/dsp/engine/virtual_analog_engine.cc",
    "vendor/plaits/dsp/engine/modal_engine.cc",
    "vendor/plaits/dsp/physical_modelling/modal_voice.cc",
    "vendor/plaits/dsp/physical_modelling/resonator.cc",
    "vendor/stmlib/utils/random.cc",
]

# TEST: stmlib's portable code instead of its ARM assembly; M_PI: newlib leaves it out in strict C++
o2_cflags = ["-DM_PI=3.14159265358979323846", "-DTEST"]
# the C library's and libc++'s headers from the AC79 SDK, which the toolchain's C++ compiler lacks (the FM-1 only)
o2_device_include = ["vendor/cxx", "vendor/newlib"]
words = "words.tsv"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI devices too
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "Hybrid DSP synthesizer for M-VAVE FM-1"
repo = "https://github.com/gravkode/gravkode-fm1"
licence = "MPL-2.0"
credits = "Built on fm1-base. Sound engines: Mutable Instruments Plaits by Émilie Gillet (MIT)."

vendored = ["vendor/"]
